name: Build

# Every push and pull request: run the tests and make sure the extension builds.
# A version tag (v1.2.3): also attach the two zip files to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release on a tag
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (versions locked by pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build and package
        run: |
          pnpm run build:manifest
          pnpm run pack:share
          node ./scripts/pack-store.mjs

      - name: Check the zip contents
        run: |
          unzip -l "dist/anyread-md-$(node -p "require('./package.json').version").zip" | grep -q 'anyread-md/manifest.json'
          unzip -l dist/*-store.zip | grep -qE ' manifest.json$'
          unzip -l dist/*-store.zip | grep -q 'js/content.js'
          ls -l dist

      - name: Keep the zip files with the run
        uses: actions/upload-artifact@v4
        with:
          name: anyread-md
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "AnyRead MD $GITHUB_REF_NAME" \
            --generate-notes
